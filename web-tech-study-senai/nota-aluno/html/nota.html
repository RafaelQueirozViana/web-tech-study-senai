<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nota do Aluno</title>
    <link rel="stylesheet" href="../css/nota.css">
</head>

<body>
    <main class="container">
        <form>
            <article class="form-control">
                <label for="nome">Digite o nome do aluno</label>
                <input type="text" id="nome" placeholder="Ex: Thiago">
            </article>

            <article class="form-control">
                <label for="nota">Digite a nota do aluno</label>
                <input type="number" min="0" max="10" id="nota" placeholder="Ex: 7">
            </article>

            <section id="message">
                <span>Digite o nome e a nota do aluno.</span>
            </section>

            <button type="button" id="Verifica-nota">
                Verificar Nota
            </button>

            <div id="resultado"></div>
        </form>
    </main>

    <script src="../js/nota.js"></script>
</body>

</html>
